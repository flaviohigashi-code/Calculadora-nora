<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Noradrenalina</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        h1 {
            color: #0056b3;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 12px;
        }
        .info-text {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.4;
            background-color: #eef5fc;
            padding: 10px 12px;
            border-left: 4px solid #0056b3;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #495057;
        }
        .input-group {
            display: flex;
            align-items: center;
            width: 100%;
        }
        input[type="number"] {
            flex: 1;
            min-width: 0; /* Impede o input de quebrar o layout flex */
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px 0 0 6px;
            font-size: 15px;
            transition: border-color 0.15s ease-in-out;
            width: 100%;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #0056b3;
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15);
        }
        .unit {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-left: none;
            padding: 10px 8px;
            font-size: 13px;
            color: #495057;
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
            width: 85px;
            text-align: center;
            flex-shrink: 0; /* Impede o sufixo de esmagar o input */
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group {
            flex: 1;
            min-width: 0;
        }
        
        /* Ajuste responsivo para telas menores (como celulares) */
        @media (max-width: 400px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
        }

        .interactive-section {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        .interactive-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            text-align: center;
        }
        .btn-clear {
            display: block;
            width: 100%;
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn-clear:hover {
            background-color: #5a6268;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cálculo de Noradrenalina</h1>
    
    <div class="info-text">
        Concentração padrão de referência para o cálculo: Ampola de 4mg em 4mL (1mg/mL).
    </div>

    <!-- Parâmetros Fixos/Configuração da Solução -->
    <div class="row">
        <div class="form-group">
            <label for="ampolas">Nº de Ampolas</label>
            <div class="input-group">
                <input type="number" id="ampolas" value="1" step="any" min="0.1">
                <span class="unit">amp(s)</span>
            </div>
        </div>
        
        <div class="form-group">
            <label for="peso">Peso do Paciente</label>
            <div class="input-group">
                <input type="number" id="peso" value="60" step="any" min="1">
                <span class="unit">kg</span>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="volume">Volume Final da Solução</label>
        <div class="input-group">
            <input type="number" id="volume" value="250" step="any" min="1">
            <span class="unit">mL</span>
        </div>
    </div>

    <!-- Seção Interativa Bidirecional -->
    <div class="interactive-section">
        <div class="interactive-title">Cálculo Bidirecional (Dose ⇄ Vazão)</div>
        
        <div class="form-group">
            <label for="vazao">Vazão (Bomba de Infusão)</label>
            <div class="input-group">
                <input type="number" id="vazao" placeholder="Digite para calcular a dose..." step="any" min="0">
                <span class="unit">mL/h</span>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
            <label for="dose">Dose Administrada</label>
            <div class="input-group">
                <input type="number" id="dose" placeholder="Digite para calcular a vazão..." step="any" min="0">
                <span class="unit">mcg/kg/min</span>
            </div>
        </div>
    </div>

    <button class="btn-clear" onclick="limparCalculos()">Limpar Calculadores</button>

    <div class="footer">
        Desenvolvido para fins educacionais e auxílio de cálculo. Sempre revise os valores antes da administração médica.
    </div>
</div>

<script>
    const inputAmpolas = document.getElementById('ampolas');
    const inputPeso = document.getElementById('peso');
    const inputVolume = document.getElementById('volume');
    const inputVazao = document.getElementById('vazao');
    const inputDose = document.getElementById('dose');

    // Variável de controle para evitar loops infinitos de eventos de input
    let mudandoOrigem = null;

    // Adiciona ouvintes de evento para os inputs base para recalcular o valor ativo
    [inputAmpolas, inputPeso, inputVolume].forEach(input => {
        input.addEventListener('input', () => {
            if (mudandoOrigem === 'vazao' || (!inputDose.value && inputVazao.value)) {
                calcularDose();
            } else if (mudandoOrigem === 'dose' || (!inputVazao.value && inputDose.value)) {
                calcularVazao();
            }
        });
    });

    // Ouvinte para quando o usuário digita na VAZÃO (calcula DOSE)
    inputVazao.addEventListener('input', () => {
        mudandoOrigem = 'vazao';
        calcularDose();
    });

    // Ouvinte para quando o usuário digita na DOSE (calcula VAZÃO)
    inputDose.addEventListener('input', () => {
        mudandoOrigem = 'dose';
        calcularVazao();
    });

    function obterVariaveisBase() {
        const ampolas = parseFloat(inputAmpolas.value) || 0;
        const peso = parseFloat(inputPeso.value) || 0;
        const volume = parseFloat(inputVolume.value) || 0;
        
        // Cada ampola de nora possui 4mg (4000 mcg)
        const noraTotalMcg = ampolas * 4000; 
        
        // Concentração em mcg/mL
        const concentracao = volume > 0 ? (noraTotalMcg / volume) : 0;

        return { peso, concentracao };
    }

    function calcularDose() {
        if (inputVazao.value === '') {
            inputDose.value = '';
            return;
        }

        const vazao = parseFloat(inputVazao.value) || 0;
        const { peso, concentracao } = obterVariaveisBase();

        if (peso <= 0 || concentracao <= 0 || vazao <= 0) {
            inputDose.value = '0';
            return;
        }

        // 1. mcg/h = vazao (mL/h) * concentracao (mcg/mL)
        // 2. mcg/min = (vazao * concentracao) / 60
        // 3. mcg/kg/min = ((vazao * concentracao) / 60) / peso
        const dose = ((vazao * concentracao) / 60) / peso;
        
        // Exibe com 4 casas decimais para melhor precisão em doses pequenas
        inputDose.value = Number(dose.toFixed(4));
    }

    function calcularVazao() {
        if (inputDose.value === '') {
            inputVazao.value = '';
            return;
        }

        const dose = parseFloat(inputDose.value) || 0;
        const { peso, concentracao } = obterVariaveisBase();

        if (peso <= 0 || concentracao <= 0 || dose <= 0) {
            inputVazao.value = '0';
            return;
        }

        // 1. mcg/min = dose (mcg/kg/min) * peso (kg)
        // 2. mcg/h = dose * peso * 60
        // 3. vazao (mL/h) = (dose * peso * 60) / concentracao
        const vazao = (dose * peso * 60) / concentracao;
        
        // Exibe com 2 casas decimais
        inputVazao.value = Number(vazao.toFixed(2));
    }

    function limparCalculos() {
        inputVazao.value = '';
        inputDose.value = '';
        mudandoOrigem = null;
    }
</script>

</body>
</html>
